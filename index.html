<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zius Business Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<style>
:root{--y:#FFD900;--k:#000}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:15px/1.5 "Segoe UI",Tahoma,Arial,sans-serif;background:#f3f2ec;color:#000;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--k);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:5px solid var(--y)}
header img{width:46px;height:46px;border-radius:8px}
header h1{flex:1;margin:0;font-size:17px;font-weight:600}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;max-width:980px;margin:auto}
nav button{flex:1;white-space:nowrap;border:0;background:#e4e2d6;padding:10px 14px;border-radius:10px 10px 0 0;font:inherit;cursor:pointer}
nav button.on{background:var(--y);font-weight:700}
main{max-width:980px;margin:auto;padding:0 16px 40px}
section{background:#fff;border-top:5px solid var(--y);padding:16px;border-radius:0 0 12px 12px}
h3{margin:18px 0 10px;font-size:16px}
h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.c{background:#f3f2ec;border-radius:10px;padding:14px;border-inline-start:6px solid var(--y)}
.c small{display:block;color:#555}
.c b{font-size:21px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
label{display:block;font-size:13px;color:#555;margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid #bbb;border-radius:8px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--y);outline-offset:1px}
.ln{display:grid;grid-template-columns:3fr 1fr 1.3fr auto;gap:8px;margin-bottom:8px;align-items:center}
.ln.h{font-size:12px;color:#555;margin-bottom:2px}
.btn{background:var(--y);color:#000;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.s{background:#eee;font-weight:400;padding:6px 10px}
.btn.r{background:#fde2e2;color:#a00;font-weight:400;padding:6px 10px}
header .btn{background:#222;color:#fff;font-weight:400;padding:7px 12px}
.tot{font-size:19px;font-weight:700;margin:10px 0}
.w{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:start;white-space:nowrap}
th{color:#555;font-weight:600;font-size:13px}
.bar{height:10px;background:#eee;border-radius:5px;overflow:hidden;margin:3px 0 10px}
.bar i{display:block;height:100%;background:var(--k)}
.pos{color:#0a7a2f}.neg{color:#c00}
.em{color:#777;padding:10px 0}
#lg{min-height:100vh;display:grid;place-items:center;background:var(--y);padding:16px}
#lg form{background:#fff;border-radius:16px;padding:24px;width:min(360px,100%);text-align:center}
#lg img{width:150px;border-radius:12px;margin-bottom:10px}
#lg input{margin-bottom:10px;text-align:center}
#lm{color:#c00;min-height:22px}
#ts{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;background:#000;color:var(--y);padding:10px 18px;border-radius:8px;font-weight:700}
header select{width:auto;background:#222;color:#fff;border-color:#444;padding:7px}
@media(max-width:560px){.ln{grid-template-columns:2fr 1fr 1fr auto}}
</style>
</head>
<body>

<div id="lg">
<form id="lf">
<img src="logo.png" alt="Zius">
<p id="lt" style="font-weight:700;margin:0 0 12px"></p>
<input id="lp" type="password" data-i="pw" autocomplete="current-password">
<input id="lp2" type="password" data-i="pw2" autocomplete="new-password" hidden>
<div id="lm"></div>
<button class="btn" style="width:100%" data-i="enter"></button>
</form>
</div>

<div id="ap" hidden>
<header>
<img src="logo.png" alt="Zius">
<h1 data-i="app"></h1>
<select id="lb"><option value="ar">العربية</option><option value="en">English</option><option value="it">Italiano</option><option value="es">Español</option></select>
<button class="btn" id="ob" data-i="out"></button>
</header>
<nav id="nv">
<button data-v="d" data-i="d"></button>
<button data-v="b" data-i="bkt"></button>
<button data-v="s" data-i="s"></button>
<button data-v="e" data-i="e"></button>
<button data-v="st" data-i="st"></button>
</nav>
<main>

<section id="v-d">
<div class="row">
<div><label data-i="month"></label><input type="month" id="mf"></div>
<div style="align-self:end"><button class="btn s" id="ma" data-i="all"></button></div>
</div>
<div class="grid" id="cd"></div>
<h3 data-i="bycat"></h3><div id="bc"></div>
<h3 data-i="bymon"></h3><div class="w" id="bm"></div>
</section>

<datalist id="sv"></datalist>
<section id="v-b">
<div class="c" style="margin-bottom:14px">
<b style="font-size:16px" data-i="onT"></b>
<p class="em" style="margin:4px 0" data-i="onN"></p>
<form id="onf" class="row" style="margin:0"><input id="onE" type="email" data-i="onE" autocomplete="username" required><input id="onP" type="password" data-i="pw" autocomplete="current-password" required><button class="btn" data-i="onC"></button></form>
<div id="ons" hidden><span class="pos" data-i="onOk"></span> <button type="button" class="btn s" id="onX" data-i="out"></button><small id="onL" style="direction:ltr;text-align:start;user-select:all"></small></div>
</div>
<h3 data-i="newb"></h3>
<form id="fb">
<div class="row">
<div><label data-i="cust"></label><input id="bn" required></div>
<div><label data-i="phone"></label><input id="bp" type="tel"></div>
<div><label data-i="date"></label><input type="date" id="bd" required></div>
<div><label data-i="time"></label><input type="time" id="bt" required></div>
<div><label data-i="svc"></label><select id="bs"></select></div>
<div><label data-i="price"></label><input type="number" id="bq" min="0" step="0.01"></div>
<div><label data-i="note"></label><input id="bo"></div>
</div>
<button class="btn" data-i="addb"></button>
</form>
<h3 data-i="bkt"></h3>
<div class="w" id="bl"></div>
</section>

<section id="v-s">
<h3 data-i="newinv"></h3>
<form id="fs">
<div class="row">
<div><label data-i="cust"></label><input id="sc"></div>
<div><label data-i="date"></label><input type="date" id="sd" required></div>
<div><label data-i="pay"></label><select id="sp"></select></div>
</div>
<div class="ln h"><span data-i="item"></span><span data-i="qty"></span><span data-i="price"></span><span></span></div>
<div id="lines"></div>
<button type="button" class="btn s" id="al" data-i="addl"></button>
<div class="tot"><span data-i="total"></span>: <span id="tt"></span></div>
<button class="btn" data-i="savei"></button>
</form>
<h3 data-i="s"></h3>
<div class="w" id="sl"></div>
</section>

<section id="v-e">
<h3 data-i="newexp"></h3>
<form id="fe">
<div class="row">
<div><label data-i="date"></label><input type="date" id="ed" required></div>
<div><label data-i="cat"></label><select id="ec"></select></div>
<div><label data-i="desc"></label><input id="eds"></div>
<div><label data-i="amt"></label><input type="number" id="ea" min="0.01" step="0.01" required></div>
</div>
<button class="btn" data-i="adde"></button>
</form>
<h3 data-i="e"></h3>
<div class="w" id="el"></div>
</section>

<section id="v-st">
<h3 data-i="shop"></h3>
<div class="row">
<div><label data-i="shop"></label><input id="ss"></div>
<div><label data-i="cur"></label><select id="sr"></select></div>
</div>
<button class="btn" id="sv" data-i="savs"></button>
<h3 data-i="chpw"></h3>
<div class="row"><div><input type="password" id="np" autocomplete="new-password"></div></div>
<button class="btn" id="cp" data-i="savs"></button>
<h3 data-i="backup"></h3>
<p class="em" data-i="bnote"></p>
<button class="btn" id="ex" data-i="exb"></button>
<button class="btn s" id="im" data-i="imb"></button>
<input type="file" id="fi" accept=".json,application/json" hidden>
</section>

</main>
</div>
<div id="ts" hidden></div>

function show(v){

/* login */
$('#lp2').hidden=!!D.set.pw;
$('#lf').onsubmit=async e=>{
 e.preventDefault();const p=$('#lp').value;
 if(!D.set.pw){

  D.set.pw=await h(p);save();
 }else if(await h(p)!==D.set.pw){$('#lm').textContent=t('bad');return}

};
function unlock(){$('#lg').hidden=true;$('#ap').hidden=false;$('#lp').value='';$('#lm').textContent='';show('d')}
$('#ob').onclick=()=>{sessionStorage.removeItem('ok');$('#ap').hidden=true;$('#lg').hidden=false;$('#lp2').hidden=true;applyLang()};
$('#lb').onchange=()=>{D.set.lang=$('#lb').value;save();applyLang()};
$('#nv').onclick=e=>{if(e.target.dataset.v){show(e.target.dataset.v);render()}};

/* invoice lines */
function addLine(){
 const r=document.createElement('div');r.className='ln';
 r.innerHTML='<input class="n" list="sv"><input class="q" type="number" min="1" step="1" value="1"><input class="p" type="number" min="0" step="0.01"><button type="button" class="btn r">×</button>';
 $('#lines').append(r);
}
function calc(){$('#tt').textContent=fm($$('#lines .ln').reduce((s,r)=>s+(+r.querySelector('.q').value||0)*(+r.querySelector('.p').value||0),0))}
function resetInv(){$('#fs').reset();$('#lines').innerHTML='';addLine();$('#sd').value=today();calc()}
$('#al').onclick=addLine;
$('#lines').oninput=calc;
$('#lines').onclick=e=>{if(e.target.tagName=='BUTTON'){e.target.parentNode.remove();if(!$('#lines .ln'))addLine();calc()}};
$('#fs').onsubmit=e=>{
 e.preventDefault();
 const lines=$$('#lines .ln').map(r=>({n:r.querySelector('.n').value.trim(),q:+r.querySelector('.q').value||0,p:+r.querySelector('.p').value||0})).filter(l=>l.q>0&&l.p>0);
 if(!lines.length){toast(t('invalid'));return}
 D.sales.push({id:Date.now(),no:Math.max(0,...D.sales.map(x=>x.no))+1,cust:$('#sc').value.trim(),date:$('#sd').value,pay:$('#sp').value,lines,total:lines.reduce((s,l)=>s+l.q*l.p,0)});
 save();resetInv();render();toast(t('saved'));
};

/* expenses */
$('#fe').onsubmit=e=>{
 e.preventDefault();
 D.exp.push({id:Date.now(),date:$('#ed').value,cat:$('#ec').value,desc:$('#eds').value.trim(),amt:+$('#ea').value});
 save();$('#eds').value='';$('#ea').value='';render();toast(t('saved'));
};

/* list actions */
function act(e){
 const b=e.target.closest('button');if(!b)return;
 const id=+b.dataset.id,k=b.dataset.k;
 if(b.dataset.a=='pr')return pr(id);
 if(!confirm(t('conf')))return;
 D[k]=D[k].filter(x=>x.id!=id);save();render();
}
$('#sl').onclick=act;$('#el').onclick=act;

function pr(id){
 const v=D.sales.find(x=>x.id==id),w=open('','_blank');if(!w)return;
 w.document.write(`<html dir="${document.documentElement.dir}"><head><meta charset="utf-8"><title>#${v.no}</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:700px;margin:auto;padding:24px}img{width:100px;border-radius:8px}table{width:100%;border-collapse:collapse;margin:16px 0}td,th{border-bottom:1px solid #ccc;padding:6px;text-align:start}</style></head><body><img src="${new URL('logo.png',location.href).href}"><h2>${esc(D.set.shop)} #${v.no}</h2><p>${t('cust')}: ${esc(v.cust||'-')}<br>${t('date')}: ${v.date}<br>${t('pay')}: ${t(v.pay)}</p><table><tr><th>${t('item')}</th><th>${t('qty')}</th><th>${t('price')}</th><th>${t('total')}</th></tr>${v.lines.map(l=>`<tr><td>${esc(l.n)}</td><td>${l.q}</td><td>${fm(l.p)}</td><td>${fm(l.q*l.p)}</td></tr>`).join('')}</table><h3>${t('total')}: ${fm(v.total)}</h3><script>onload=()=>print()<\/script></body></html>`);
 w.document.close();
}

/* render */
function render(){
 const m=$('#mf').value,f=a=>m?a.filter(x=>x.date.startsWith(m)):a;
 const S=f(D.sales),E=f(D.exp),R=sum(S,'total'),X=sum(E,'amt'),N=R-X;
 $('#cd').innerHTML=`<div class="c"><small>${t('rev')}</small><b class="pos">${fm(R)}</b></div><div class="c"><small>${t('exps')}</small><b class="neg">${fm(X)}</b></div><div class="c"><small>${t('net')}</small><b class="${N<0?'neg':'pos'}">${fm(N)}</b></div><div class="c"><small>${t('cnt')}</small><b>${S.length}</b></div><div class="c"><small>${t('tod')}</small><b>${D.book.filter(x=>x.date==today()&&x.st=='bk').length}</b></div>`;
 const rows=CATS.map(c=>[c,sum(E.filter(x=>x.cat==c),'amt')]).filter(r=>r[1]>0);
 $('#bc').innerHTML=rows.length?rows.map(([c,v])=>`<div>${t(c)}: <b>${fm(v)}</b> (${Math.round(v/X*100)}%)<div class="bar"><i style="width:${v/X*100}%"></i></div></div>`).join(''):`<div class="em">${t('empty')}</div>`;
 const ms=[...new Set([...D.sales,...D.exp].map(x=>x.date.slice(0,7)))].sort().reverse().slice(0,6);
 $('#bm').innerHTML=ms.length?`<table><tr><th>${t('mon')}</th><th>${t('rev')}</th><th>${t('exps')}</th><th>${t('net')}</th></tr>${ms.map(k=>{const r=sum(D.sales.filter(x=>x.date.startsWith(k)),'total'),x=sum(D.exp.filter(x=>x.date.startsWith(k)),'amt'),n=r-x;return`<tr><td>${k}</td><td>${fm(r)}</td><td>${fm(x)}</td><td class="${n<0?'neg':'pos'}">${fm(n)}</td></tr>`}).join('')}</table>`:`<div class="em">${t('empty')}</div>`;
 const ds=[...D.sales].sort((a,b)=>b.date.localeCompare(a.date)||b.no-a.no);
 $('#sl').innerHTML=ds.length?`<table><tr><th>${t('no')}</th><th>${t('date')}</th><th>${t('cust')}</th><th>${t('pay')}</th><th>${t('total')}</th><th></th></tr>${ds.map(v=>`<tr><td>${v.no}</td><td>${v.date}</td><td>${esc(v.cust||'-')}</td><td>${t(v.pay)}</td><td>${fm(v.total)}</td><td><button class="btn s" data-a="pr" data-id="${v.id}">${t('print')}</button> <button class="btn r" data-k="sales" data-id="${v.id}">${t('del')}</button></td></tr>`).join('')}</table>`:`<div class="em">${t('empty')}</div>`;
 const de=[...D.exp].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
 $('#el').innerHTML=de.length?`<table><tr><th>${t('date')}</th><th>${t('cat')}</th><th>${t('desc')}</th><th>${t('amt')}</th><th></th></tr>${de.map(v=>`<tr><td>${v.date}</td><td>${t(v.cat)}</td><td>${esc(v.desc||'-')}</td><td>${fm(v.amt)}</td><td><button class="btn r" data-k="exp" data-id="${v.id}">${t('del')}</button></td></tr>`).join('')}</table>`:`<div class="em">${t('empty')}</div>`;
 const bs=[...D.book].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 $('#bl').innerHTML=bs.length?`<table><tr><th>${t('date')}</th><th>${t('time')}</th><th>${t('cust')}</th><th>${t('svc')}</th><th>${t('price')}</th><th>${t('status')}</th><th></th></tr>${bs.map(v=>`<tr><td>${v.date}</td><td>${v.time}</td><td>${esc(v.cust)}${v.ph?'<br><small>'+esc(v.ph)+'</small>':''}</td><td>${t(v.sv)}${v.note?'<br><small>'+esc(v.note)+'</small>':''}</td><td>${v.p?fm(v.p):'-'}</td><td>${t({bk:'booked',dn:'done',cx:'canc'}[v.st])}</td><td>${v.st=='bk'?`<button class="btn s" data-a="dn" data-id="${v.id}">${t('fin')}</button> <button class="btn s" data-a="cx" data-id="${v.id}">${t('cancel')}</button> `:''}<button class="btn r" data-a="del" data-id="${v.id}">${t('del')}</button></td></tr>`).join('')}</table>`:`<div class="em">${t('empty')}</div>`;
 $('#ss').value=D.set.shop;$('#sr').value=D.set.cur;calc();
}
$('#mf').onchange=render;
$('#ma').onclick=()=>{$('#mf').value='';render()};

/* bookings */
$('#fb').onsubmit=e=>{
 e.preventDefault();const d=$('#bd').value,tm=$('#bt').value;
 if(D.book.some(x=>x.st=='bk'&&x.date==d&&x.time==tm)){toast(t('taken'));return}
 D.book.push({id:Date.now(),cust:$('#bn').value.trim(),ph:$('#bp').value.trim(),date:d,time:tm,sv:$('#bs').value,p:+$('#bq').value||0,note:$('#bo').value.trim(),st:'bk'});
 save();window.zSync&&zSync(D.book[D.book.length-1],'add');$('#bn').value=$('#bp').value=$('#bq').value=$('#bo').value='';render();toast(t('saved'));
};
$('#bl').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;
 const x=D.book.find(v=>v.id==b.dataset.id);if(!x)return;
 if(b.dataset.a=='dn'){
  x.st='dn';
  if(!x.p&&x.src=='online')x.p=+prompt(t('price'))||0;
  if(x.p>0)D.sales.push({id:Date.now(),no:Math.max(0,...D.sales.map(v=>v.no))+1,cust:x.cust,date:x.date,pay:'cash',lines:[{n:t(x.sv)+(x.note?' - '+x.note:''),q:1,p:x.p}],total:x.p});
 }else if(b.dataset.a=='cx')x.st='cx';
 else{if(!confirm(t('conf')))return;D.book=D.book.filter(v=>v!=x)}
 save();render();window.zSync&&zSync(x,b.dataset.a);
};

/* settings + backup */
$('#sv').onclick=()=>{D.set.shop=$('#ss').value.trim()||'Zius';D.set.cur=$('#sr').value;save();render();toast(t('saved'))};
$('#cp').onclick=async()=>{const p=$('#np').value;if(p.length<4){toast(t('pwerr'));return}D.set.pw=await h(p);save();$('#np').value='';toast(t('saved'))};
$('#ex').onclick=()=>{
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({sales:D.sales,exp:D.exp,book:D.book,shop:D.set.shop,cur:D.set.cur})],{type:'application/json'}));
 a.download='zius-backup-'+today()+'.json';a.click();
};
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const j=JSON.parse(r.result);
   if(!Array.isArray(j.sales)||!Array.isArray(j.exp))throw 0;
   if(!confirm(t('impc')))return;
   D.sales=j.sales;D.exp=j.exp;D.book=Array.isArray(j.book)?j.book:[];if(j.shop)D.set.shop=j.shop;if(CURS.includes(j.cur))D.set.cur=j.cur;
   save();render();toast(t('impok'));
  }catch(x){toast(t('impbad'))}
 };
 r.readAsText(f);e.target.value='';
};

/* start */
resetInv();$('#ed').value=$('#bd').value=today();applyLang();
if(sessionStorage.ok&&D.set.pw)unlock();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import{getFirestore,collection,onSnapshot,doc,setDoc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBHJuW7y2F-nk_EZePqsP1wET8ItSu-HLY",authDomain:"zius-barbershops-manager.firebaseapp.com",projectId:"zius-barbershops-manager",storageBucket:"zius-barbershops-manager.firebasestorage.app",messagingSenderId:"1033894225665",appId:"1:1033894225665:web:fbd264bbb451e259705d00"});
const auth=getAuth(app),db=getFirestore(app);
let unsub=null;
$('#onL').textContent=new URL('book.html',location.href).href;
$('#onf').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#onE').value.trim(),$('#onP').value);$('#onP').value=''}catch(x){toast(t('onBad'))}};
$('#onX').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 $('#onf').hidden=!!u;$('#ons').hidden=!u;
 if(unsub){unsub();unsub=null}
 if(!u)return;
 let first=true;
 unsub=onSnapshot(collection(db,'bookings'),s=>{
  let n=0;
  s.docs.forEach(d=>{
   if(D.book.some(x=>x.fid==d.id))return;
   const v=d.data();
   D.book.push({id:Date.now()+n,fid:d.id,cust:v.cust,ph:v.ph,date:v.date,time:v.time,sv:v.sv,p:0,note:v.note||'',st:v.st||'bk',src:'online'});n++;
  });
  if(n){save();render();if(!first)toast(t('newon'))}
  first=false;
 },()=>toast(t('onBad')));
});
window.zSync=async(x,a)=>{
 if(!auth.currentUser||!x)return;
 const k=x.date+'_'+x.time;
 try{
  if(a=='add')await setDoc(doc(db,'slots',k),{date:x.date,time:x.time});
  else if(a=='cx'||a=='del'){
   if(a=='cx'||x.st=='bk')await deleteDoc(doc(db,'slots',k));
   if(x.fid)a=='del'?await deleteDoc(doc(db,'bookings',x.fid)):await updateDoc(doc(db,'bookings',x.fid),{st:'cx'});
  }else if(a=='dn'&&x.fid)await updateDoc(doc(db,'bookings',x.fid),{st:'dn'});
 }catch(e){toast('⚠ '+(e.code||e.message))}
};
</script>
